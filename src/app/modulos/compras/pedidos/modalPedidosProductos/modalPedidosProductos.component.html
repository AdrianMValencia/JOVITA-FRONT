<div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Agregar Item</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
      <span class="material-icons">close</span>
    </button>
</div>

<!-- Body -->
<div class="modal-body">
    <div class="row">
      <form autocomplete="off" novalidate [formGroup]="formGroup" (ngSubmit)="saveItems(formGroup)" class="col-lg-12">
          <div class="row">
            <div class="col-lg-6">
              <div class="form-group">
                <label class="font-weight-bolder">Producto</label>
                <div class="ng-autocomplete">
                  <ng-autocomplete
                    [data]="cboProductos"
                    [searchKeyword]="'nombre'"
                    placeholder=""
                    [itemTemplate]="itemTemplate2"
                    [notFoundTemplate]="notFoundTemplate2"
                    (selected)='selectEventProductos($event)'
                    formControlName="productos">
                  </ng-autocomplete>

                  <ng-template #itemTemplate2 let-item>
                  <a [innerHTML]="item.nombre"></a>
                  </ng-template>

                  <ng-template #notFoundTemplate2 let-notFound>
                  <div [innerHTML]="notFound"></div>
                  </ng-template>
                </div>
              </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label>Codigo</label>
                <input type="text" class="form-control" name="codigoBarra" formControlName="codigoBarra">
              </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label>Precio de Compra </label>
                <input type="text" class="form-control" formControlName="precioCompra" (keyup)="calcularTotales(cantidad.value)" required>
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('precioCompra').hasError('required')">Obligatorio</div>
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('precioCompra').hasError('pattern')">Texto Inválido</div>
              </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label>Tipo de Presentación </label>
                <select class="form-control custom-select" (change)="calcularPaquete($event.target)" formControlName="tipoPresentacion" required>
                  <option value="0">[SELECCIONE]</option>
                  <option value="UND">UND</option>
                  <option value="PQTE">PQTE</option>
                </select>
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('tipoPresentacion').hasError('required')">Obligatorio</div>
              </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label>Cantidad</label>
                <input type="text" class="form-control" formControlName="cantidad" (keyup)="calcularTotales(cantidad.value)" (input)="funcionesService.soloAceptarNumerosPuntoDecimal($event.target)" required>
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('cantidad').hasError('required')">Obligatorio</div>
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('cantidad').hasError('pattern')">Texto Inválido</div>
              </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label>Cantidad Paquetes</label>
                <input type="text" class="form-control" formControlName="cantidadPaquetes" (keyup)="calcularTotalesPaquete(cantidadPaquetes.value)" (input)="funcionesService.soloAceptarNumerosPuntoDecimal($event.target)" required [readOnly]="readonly">
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('cantidadPaquetes').hasError('pattern')">Texto Inválido</div>
              </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label>Total</label>
                <input type="text" class="form-control" formControlName="total" required readonly>
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('total').hasError('required')">Texto Inválido</div>
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('total').hasError('pattern')">Texto Inválido</div>
              </div>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-6 form-group">
                <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
                <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-times"></i> CERRAR</button>
            </div>
          </div>
        </form>
    </div>
</div>

<div class="modal-footer">
    <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
