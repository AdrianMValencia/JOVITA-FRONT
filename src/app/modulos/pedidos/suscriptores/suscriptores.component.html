<div class="wrapper wrapper-content animated fadeInRight">
  <div class="row">
    <div class="col-lg-12">
      <div class="ibox">
        <div class="ibox-title">
          <h5>Suscriptores del Newsletter</h5>
        </div>
        <div class="ibox-content">
          <!-- Filtros -->
          <form [formGroup]="fgFiltros">
            <div class="row">
              <div class="col-lg-4 form-group">
                <label>Email:</label>
                <input type="text" formControlName="email" class="form-control" placeholder="Buscar por email">
              </div>
              <div class="col-lg-3 form-group">
                <label>Fecha Inicio:</label>
                <input type="date" formControlName="fechaIni" class="form-control">
              </div>
              <div class="col-lg-3 form-group">
                <label>Fecha Fin:</label>
                <input type="date" formControlName="fechaFin" class="form-control">
              </div>
              <div class="col-lg-2 form-group d-flex align-items-end">
                <button type="button" class="btn btn-warning btn-block" (click)="limpiarFiltros()">
                  <i class="fa fa-eraser"></i> Limpiar
                </button>
              </div>
            </div>
          </form>

          <!-- Botones de Descarga -->
          <div class="row mb-3">
            <div class="col-lg-12">
              <button type="button" class="btn btn-danger mr-2" (click)="downloadPDF()">
                <i class="fa fa-file-pdf-o"></i> Descargar PDF
              </button>
              <button type="button" class="btn btn-primary" (click)="downloadExcel()">
                <i class="fa fa-file-excel-o"></i> Descargar Excel
              </button>
            </div>
          </div>

          <!-- Tabla -->
          <div class="table-responsive">
            <table mat-table [dataSource]="MainDS" class="table table-striped table-hover">
              
              <!-- Columna ID -->
              <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef class="text-center"> ID </th>
                <td mat-cell *matCellDef="let row" class="text-center"> {{row.id}} </td>
              </ng-container>

              <!-- Columna Email -->
              <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef> Email </th>
                <td mat-cell *matCellDef="let row"> {{row.email}} </td>
              </ng-container>

              <!-- Columna Fecha -->
              <ng-container matColumnDef="fecha">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Fecha de Suscripción </th>
                <td mat-cell *matCellDef="let row" class="text-center"> 
                  {{funcionesService.formatearFechaDDMMYYYY(row.created_at)}} 
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="MainDC"></tr>
              <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>

              <!-- Fila cuando no hay datos -->
              <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center" [attr.colspan]="MainDC.length">
                  <div class="alert alert-info mb-0">
                    <i class="fa fa-info-circle"></i> No se encontraron suscriptores
                  </div>
                </td>
              </tr>
            </table>
          </div>

          <!-- Paginador -->
          <mat-paginator #pagMain [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
        </div>
      </div>
    </div>
  </div>
</div>
