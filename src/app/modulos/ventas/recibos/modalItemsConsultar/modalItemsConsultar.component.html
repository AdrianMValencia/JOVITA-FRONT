<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Busqueda</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span class="material-icons">close</span>
  </button>
</div>

<!-- Body -->
<div class="modal-body">
  <div class="row mb-4">
    <div class="col-lg-12">
      <input class="form-control form-control-sm" id="codigoBarra" (input)="onEnter($event.target)" placeholder="INGRESE CÓDIGO DEL PRODUCTO">
    </div>
  </div>
  <div class="row">
    <div class="col-lg-12">
      <div class="form-group">
        <label class="font-weight-bolder">Producto:</label>
        <div class="ng-autocomplete">
          <ng-autocomplete
            [data]="cboProductos"
            [searchKeyword]="'nombre'"
            placeholder=""
            [itemTemplate]="itemTemplate2"
            [notFoundTemplate]="notFoundTemplate2"
            (selected)='selectEventProductos($event)'
            (inputChanged)="buscarProductos($event)">
          </ng-autocomplete>

          <ng-template #itemTemplate2 let-item>
          <a [innerHTML]="item.nombre"></a>
          </ng-template>

          <ng-template #notFoundTemplate2 let-notFound>
          <div [innerHTML]="notFound"></div>
          </ng-template>
        </div>
      </div>
    </div>
      <div class="col-lg-6">
          <div class="form-group">
              <label>Descripción del Producto</label>
              <input type="text" class="form-control" [(ngModel)]="productos.observaciones" readonly>
          </div>
      </div>
      <div class="col-lg-6">
          <div class="form-group">
              <label>Precio de Venta</label>
              <input type="text" class="form-control" [(ngModel)]="productos.precio" required readonly>
          </div>
      </div>
  </div>
  <div class="row mt-3">
    <div class="col-lg-12">
      <div class="form-group">
        <button type="button" class="btn btn-outline btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-times"></i> ESC - CERRAR</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-footer">
  <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
