<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">¿Cantidad del Producto?</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span class="material-icons">close</span>
  </button>
</div>

<!-- Body -->
<div class="modal-body">
  <div class="row">
    <div class="col-lg-9">
      <div class="row">
        <div class="col-sm-12 text-center font-weight-bolder" style="font-size: 1.5rem;">{{ productos.nombre }}</div>
        <div class="col-sm-6 text-center">
          <div class="form-group">
            <label for="cantidad">Cantidad del Producto:</label>
            <input type="text" class="form-control" style="font-size: 13px;" (input)="calcular($event.target)" id="cantidad" [(ngModel)]="cantidad" (input)="funcionesService.soloAceptarNumerosPuntoDecimal($event.target)">
          </div>
        </div>
        <div class="col-sm-6">
          <div class="form-group">
            <label for="precio">Importe Actual:</label>
            <input type="text" class="form-control" style="font-size: 13px;" [(ngModel)]="precio" (input)="calcular2($event.target)" (input)="funcionesService.soloAceptarNumerosPuntoDecimal($event.target)">
          </div>
        </div>
        <div class="col-sm-12 text-center">
          <div class="form-group font-weight-bolder" style="font-size: 1.5rem;">Precio Unidad = {{ productos.precio | number:'0.2-2' }}</div>
        </div>
      </div>
    </div>
    <hr>
    <div class="col-lg-3">
      <div class="row">
        <div class="col-sm-12 text-center">
          <div class="form-group">
            <div class="font-weight-bolder">ACCIONES:</div>
          </div>
        </div>
        <div class="col-sm-12">
          <button type="button" class="btn btn-outline btn-success dim btn-block btn-sm" (click)="aceptar()"><i class="fa fa-share"></i> Aceptar</button>
        </div>
        <div class="col-sm-12">
          <button type="button" class="btn btn-outline btn-danger dim btn-block btn-sm" (click)="activeModal.dismiss()"><i class="fa fa-times"></i> Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-footer">
  <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
