<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-6">
            <div class="form-group">
              <label class="font-weight-bolder">Código de Producto:</label>
              <input class="form-control form-control-sm" id="codigoBarra" (keyup)="onEnter($event.target)">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label class="font-weight-bolder">Producto:</label>
              <div class="ng-autocomplete">
                <ng-autocomplete
                  [data]="productosLista"
                  [searchKeyword]="'nombre'"
                  placeholder=""
                  [itemTemplate]="itemTemplate2"
                  [notFoundTemplate]="notFoundTemplate2"
                  (selected)='onBuscar($event)'>
                </ng-autocomplete>

                <ng-template #itemTemplate2 let-item>
                <a [innerHTML]="item.nombre"></a>
                </ng-template>

                <ng-template #notFoundTemplate2 let-notFound>
                <div [innerHTML]="notFound"></div>
                </ng-template>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <div class="table-responsive">
              <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <ng-container matColumnDef="codigoBarra">
                  <th mat-header-cell *matHeaderCellDef> Código de Barras </th>
                  <td mat-cell *matCellDef="let element" style="font-size: 14px;font-family: Arial, Helvetica, sans-serif;"> {{element.codigoBarra}} </td>
                </ng-container>

                <ng-container matColumnDef="puntoVenta">
                  <th mat-header-cell *matHeaderCellDef> Punto de Venta </th>
                  <td mat-cell *matCellDef="let element" style="font-size: 14px;font-family: Arial, Helvetica, sans-serif;"> {{element.puntoVenta}} </td>
                </ng-container>

                <ng-container matColumnDef="nombre">
                    <th mat-header-cell *matHeaderCellDef> Producto </th>
                    <td mat-cell *matCellDef="let element" style="font-size: 14px;font-family: Arial, Helvetica, sans-serif;"> {{element.nombre}} </td>
                </ng-container>

                <ng-container matColumnDef="stockActual">
                  <th mat-header-cell *matHeaderCellDef>Stock Actual</th>
                  <td mat-cell *matCellDef="let element" style="text-align: center;font-size: 14px;font-family: Arial, Helvetica, sans-serif;">{{(element.stockActual)  | number:'0.2-2'}} </td>
                </ng-container>

                <ng-container matColumnDef="puntoVentaNew">
                  <th mat-header-cell *matHeaderCellDef> Nuevo Punto de Venta </th>
                  <td mat-cell *matCellDef="let element; let i = index;" style="font-size: 14px;font-family: Arial, Helvetica, sans-serif;">
                    <select [(ngModel)]="element.idPuntoVentaNew" (selectionchange)="selectEventPuntoVenta($event.target, i)" class="form-control form-select">
                      <option value="0">[SELECCIONE]</option>
                      <option *ngFor="let item of cboPuntoVenta" [value]="item.id">{{ item.nombre }}</option>
                    </select>
                  </td>
                </ng-container>

                <ng-container matColumnDef="cantidad">
                    <th mat-header-cell *matHeaderCellDef style="width: 20%;"> Cantidad </th>
                    <td mat-cell *matCellDef="let element; let i = index" style="text-align: center;font-size: 14px;font-family: Arial, Helvetica, sans-serif;">
                      <div class="input-group">
                        <input type="text" class="form-control" [(ngModel)]="element.cantidad" (input)="funcionesService.soloAceptarNumerosPuntoDecimal($event.target)">
                      </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="motivo">
                  <th mat-header-cell *matHeaderCellDef style="width: 20%;"> Motivo </th>
                  <td mat-cell *matCellDef="let element; let i = index" style="text-align: center;font-size: 14px;font-family: Arial, Helvetica, sans-serif;">
                    <div class="input-group">
                      <input type="text" class="form-control" [(ngModel)]="element.motivo">
                    </div>
                  </td>
              </ng-container>


                <ng-container matColumnDef="noData">
                    <mat-footer-cell *matFooterCellDef [attr.colspan]="displayedColumns.length">
                        No se encuentran registros.
                    </mat-footer-cell>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <mat-footer-row *matFooterRowDef="['noData']" [hidden]="dataSource && this.dataSource.filteredData.length > 0">
                </mat-footer-row>
              </table>
            </div>
          </div>
        </div>
        <div class="row mt-4">
          <div class="col-lg-6 d-flex justify-content-start">
            <button (click)="agregarDevoluciones()" type="button" class="btn btn-info dim mr-2"><i class="fa fa-save"></i> Devolver Producto</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
