<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Devoluciones</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
<span class="material-icons">close</span>
</button>
</div>

<!-- Body -->
<div class="modal-body">
  <div class="row">
    <form autocomplete="off" novalidate [formGroup]="formGroup" (ngSubmit)="saveDevoluciones(formGroup)" class="col-lg-12">
        <div class="row">
          <div class="col-lg-6 form-group">
            <div class="form-group">
              <label>¿Devolver cantidad?</label>
              <section class="example-section">
                <mat-checkbox class="abc-checkbox-primary" (change)="showOptions($event)"  style="margin-bottom: 0px;color: white;" formControlName="stock">Si</mat-checkbox>
              </section>
            </div>
            <div class="form-group">
              <input class="form-control" formControlName="cantidad" [ngStyle]="{'display': mostrar ? 'block': 'none'}">
            </div>
          </div>
          <div class="col-lg-6 form-group">
            <div class="form-group">
              <label>Motivos</label>
              <select class="form-control form-select" formControlName="motivo">
                <option value="0">[SELECCIONE]</option>
                <option *ngFor="let item of cboMotivos" [value]="item.codigo">{{ item.titulo }}</option>
              </select>
              <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('motivo').hasError('required')">Obligatorio</div>
            </div>
          </div>
          <div class="col-lg-12">
            <div class="form-group">
              <label>Detalle</label>
              <textarea class="form-control" formControlName="detalle"></textarea>
              <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('detalle').hasError('required')">Obligatorio</div>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-lg-6 form-group">
              <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
              <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-times"></i> CERRAR</button>
          </div>
        </div>
    </form>
  </div>
</div>

<div class="modal-footer">
  <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
