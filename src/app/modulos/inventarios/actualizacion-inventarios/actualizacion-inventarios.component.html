<div class="row">
  <div class="col-lg-12">
    <!-- Filtro -->
    <div class="ibox ">
      <div div class="ibox-title">
        <h5>Aplicar filtro por :</h5>
      </div>

      <div class="ibox-content">
        <form autocomplete="off" id="fgMain" [formGroup]="fgMain">
          <div class="row">
            <div class="col-lg-6">
              <div class="form-group">
                <label class="font-weight-bolder">Punto de Venta:</label>
                <input type="text" name="puntoVenta" formControlName="puntoVenta" class="form-control" readonly>
              </div>
            </div>
        <div class="col-lg-6">
          <div class="form-group">
            <label>Categorias</label>
            <div class="ng-autocomplete">
              <ng-autocomplete
                [data]="cboCategorias"
                [searchKeyword]="'nombre'"
                placeholder=""
                [itemTemplate]="itemTemplate"
                [notFoundTemplate]="notFoundTemplate"
                (selected)='selectEvent($event)'
                formControlName="categorias">
              </ng-autocomplete>

              <ng-template #itemTemplate let-item>
              <a [innerHTML]="item.nombre"></a>
              </ng-template>

              <ng-template #notFoundTemplate let-notFound>
              <div [innerHTML]="notFound"></div>
              </ng-template>
            </div>
          </div>
        </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label class="font-weight-bolder">Fecha Desde:</label>
                <input type="date" name="fechaIni" formControlName="fechaIni" class="form-control">
              </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                <label class="font-weight-bolder">Fecha Fin:</label>
                <input type="date" name="fechaFin" formControlName="fechaFin" class="form-control">
              </div>
            </div>
            <div class="col-lg-2">
              <div class="form-group">
                <button type="button" (click)="buscar()" class="btn btn-success dim mt-3"><i
                    class="fa fa-search"></i></button>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-6 d-flex justify-content-start">
              <div class="form-group">
                <button (click)="crudRegistros()" type="button"
                  class="btn btn-info dim mr-2"><i class="fa fa-save"></i> Nuevo Inventario</button>
              </div>
            </div>
          </div>
        </form>
      </div>

      <hr>

      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-12">
            <div id="dTableMain" class="melevation">
              <table mat-table [dataSource]="MainDS" style="width: 100%;" multiTemplateDataRows>
                <ng-container matColumnDef="index">
                  <th mat-header-cell *matHeaderCellDef> # </th>
                  <td mat-cell *matCellDef="let element; let i = dataIndex;" class='m-card-title' data-label='# :'>
                    {{i + 1}}
                  </td>
                </ng-container>
                <ng-container matColumnDef="fecha">
                  <th mat-header-cell *matHeaderCellDef> Fecha Registro </th>
                  <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Fecha Registro :'>
                    {{element.created_at | date:'dd/MM/yyyy'}}
                  </td>
                </ng-container>
                <ng-container matColumnDef="categoria">
                  <th mat-header-cell *matHeaderCellDef> Categoria </th>
                  <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Categoria :'>
                    {{element.categoria}}
                  </td>
                </ng-container>
                <ng-container matColumnDef="acciones">
                  <th mat-header-cell *matHeaderCellDef> Acciones </th>
                  <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Acciones :'>
                    <button class="btn btn-info btn-rounded dim mt-2 mr-3" (click)="viewDetail(element)"><i
                        class="fa fa-edit"></i></button>
                    <button class="btn btn-danger btn-rounded dim mt-2" (click)="eliminarRegistro(element)"><i
                        class="fa fa-trash"></i></button>
                  </td>
                </ng-container>

                <ng-container matColumnDef="noData">
                  <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                    No se encuentran registros.
                  </mat-footer-cell>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                <mat-footer-row *matFooterRowDef="['noData']" [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                </mat-footer-row>
              </table>

            </div>
            <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="10"
              showFirstLastButtons></mat-paginator>
            <!-- <mat-paginator #pagMain [length]="totalRows" [pageIndex]="currentPage" [pageSize]="10" (page)="onPageChange($event)" showFirstLastButtons></mat-paginator> -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
