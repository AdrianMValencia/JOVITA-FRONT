<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-title">
        <h5>Aplicar filtro por :</h5>
      </div>
      <div class="ibox-content">
        <form autocomplete="off" id="fgMain" [formGroup]="fgMain">
          <div class="row">
            <div class="col-lg-4">
              <div class="form-group">
                <label>Roles</label>
                <div class="ng-autocomplete">
                  <ng-autocomplete
                    [data]="cboRoles"
                    [searchKeyword]="'nombreRol'"
                    placeholder=""
                    (selected)="selectEventRol($event)"
                    [itemTemplate]="itemTemplate"
                    [notFoundTemplate]="notFoundTemplate"
                    formControlName="roles">
                  </ng-autocomplete>

                  <ng-template #itemTemplate let-item>
                  <a [innerHTML]="item.nombreRol"></a>
                  </ng-template>

                  <ng-template #notFoundTemplate let-notFound>
                  <div [innerHTML]="notFound"></div>
                  </ng-template>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
                  <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" class="form-control" formControlName="nombre">
                  </div>
            </div>
            <div class="col-lg-4">
                  <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" class="form-control" formControlName="usuario">
                  </div>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-6 d-flex justify-content-start">
              <button (click)="crudRegistros()" type="button" class="btn btn-info dim mr-2"><i class="fa fa-save"></i> Agregar Usuario</button>
            </div>
            <div class="col-lg-6 d-flex justify-content-end">
                <button type="button" (click)="downloadPDF()" class="btn btn-danger dim mr-2"><i class="fa fa-file-pdf-o"></i> Descargar PDF</button>
                <button type="button" (click)="downloadExcel()" class="btn btn-primary dim"><i class="fa fa-file-excel-o"></i> Descargar Excel</button>
            </div>
          </div>
        </form>
      </div>
      <div class="ibox-content">
        <div class="row">
            <div class="col-lg-12">
                <div id="dTableMain" class="melevation">
                    <table mat-table [dataSource]="MainDS" class="example-full-width" multiTemplateDataRows>

                        <ng-container matColumnDef="nombreRol">
                            <th mat-header-cell *matHeaderCellDef> Rol </th>
                            <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Rol :'>
                                {{element.roles.nombreRol}}
        </ng-container>
                        <ng-container matColumnDef="nombre">
                            <th mat-header-cell *matHeaderCellDef> Nombres </th>
                            <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Nombres :'>
                                {{element.nombre}}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="usuario">
                          <th mat-header-cell *matHeaderCellDef> Usuario </th>
                          <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Usuario :'>
                              {{element.usuario}}
                          </td>
                      </ng-container>
                        <ng-container matColumnDef="celular">
                            <th mat-header-cell *matHeaderCellDef> Celular </th>
                            <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Celular :'>
                                {{element.celular}}
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="asignar">
                          <th mat-header-cell *matHeaderCellDef> Asignar Punto de Venta </th>
                          <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Asignar Punto de Venta :'>
                            <button class="btn btn-info btn-rounded dim mt-2" (click)="asignarPuntoVenta(element)"><i class="fa fa-edit"></i></button>
                          </td>
                      </ng-container>

                        <ng-container matColumnDef="imagen">
                            <th mat-header-cell *matHeaderCellDef style="width: 20%;"> Foto </th>
                            <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Foto :'>
                              <img *ngIf="!element.imagen" src="assets/img/sinFoto.png" width="30%">
                              <img *ngIf="element.imagen" src="{{ usuariosService.urlUpload }}{{ element.imagen }}" width="30%">
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="status">
                          <th mat-header-cell *matHeaderCellDef class="text-center"> Estado </th>
                          <td mat-cell *matCellDef="let element" class='m-card-title text-center' data-label='Estado :'>
                            <button class="btn btn-success btn-rounded dim mt-2" *ngIf="element.status === 1 || element.status === '1'">ACTIVO</button>
                            <button class="btn btn-danger btn-rounded dim mt-2" *ngIf="element.status === 0 || element.status === '0'">INACTIVO</button>
                          </td>
                      </ng-container>

                      <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef> Acciones </th>
                        <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Acciones :'>
                          <button class="btn btn-info btn-rounded dim mt-2" (click)="viewDetail(element)"><i class="fa fa-edit"></i></button>
                          <button *ngIf="element.status === '1' || element.status === 1" class="btn btn-danger btn-rounded dim mt-2" (click)="eliminarRegistro(element)"><i class="fa fa-trash"></i></button>
                        </td>
                    </ng-container>

                        <ng-container matColumnDef="noData">
                            <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                                No se encuentran registros.
                            </mat-footer-cell>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                        <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                        <mat-footer-row *matFooterRowDef="['noData']" [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                        </mat-footer-row>
                    </table>

                </div>
                <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="10" showFirstLastButtons>
                </mat-paginator>
            </div>
        </div>
        </div>
    </div>
  </div>
</div>
