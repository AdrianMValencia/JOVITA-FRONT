<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Asignar Usuarios</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span class="material-icons">close</span>
  </button>
</div>

<div class="modal-body">
  <div class="row">
    <div class="col-lg-12">
      <div class="ibox ">
        <div class="ibox-content">
          <form autocomplete="off" id="formGroup" [formGroup]="formGroup">
            <div class="row">
              <div class="col-lg-6">
                <div class="form-group">
                  <label>Punto de Venta</label>
                  <!-- <input class="form-control" name="puntoventa" formControlName="puntoventa" readonly> -->
                  <div class="ng-autocomplete">
                    <ng-autocomplete
                      [data]="cboPuntoVenta"
                      [searchKeyword]="'nombre'"
                      placeholder=""
                      (selected)="selectEventPuntoVenta($event)"
                      [itemTemplate]="itemTemplate"
                      [notFoundTemplate]="notFoundTemplate"
                      formControlName="puntoventa">
                    </ng-autocomplete>

                    <ng-template #itemTemplate let-item>
                    <a [innerHTML]="item.nombre"></a>
                    </ng-template>

                    <ng-template #notFoundTemplate let-notFound>
                    <div [innerHTML]="notFound"></div>
                    </ng-template>
                  </div>
                </div>
              </div>
              <div class="col-lg-5 mt-4" style="text-align: right;">
                <button (click)="crudRegistros()" type="button" class="btn btn-info dim mr-2"><i class="fa fa-save"></i> Asignar Usuario</button>
                <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-times"></i> Cerrar</button>
              </div>
            </div>
          </form>
        </div>
        <div class="ibox-content">
          <div class="row">
              <div class="col-lg-12">
                  <div id="dTableMain" class="melevation">
                      <table mat-table [dataSource]="MainDS" class="example-full-width" multiTemplateDataRows>

                          <ng-container matColumnDef="idPuntoVenta">
                              <th mat-header-cell *matHeaderCellDef> PuntoVenta </th>
                              <td mat-cell *matCellDef="let element" class='m-card-title' data-label='PuntoVenta :'>
                                  {{element.puntoventa.nombre}}
          </ng-container>
                          <ng-container matColumnDef="idUser">
                              <th mat-header-cell *matHeaderCellDef> Usuario </th>
                              <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Usuario :'>
                                  {{element.user.nombre}}
                              </td>
                          </ng-container>
                          <ng-container matColumnDef="acciones">
                            <th mat-header-cell *matHeaderCellDef> Acciones </th>
                            <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Acciones :'>
                              <button class="btn btn-info btn-rounded dim mt-2" (click)="viewDetail(element)"><i class="fa fa-edit"></i></button>
                              <button class="btn btn-danger btn-rounded dim mt-2" (click)="eliminarRegistro(element)"><i class="fa fa-trash"></i></button>
                            </td>
                          </ng-container>
                          <ng-container matColumnDef="noData">
                              <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                                  No se encuentran registros.
                              </mat-footer-cell>
                          </ng-container>

                          <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                          <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                          <mat-footer-row *matFooterRowDef="['noData']" [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                          </mat-footer-row>
                      </table>

                  </div>
                  <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="10" showFirstLastButtons>
                  </mat-paginator>
              </div>
          </div>
          </div>
      </div>
    </div>
  </div>
</div>
