<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-content">
        <form autocomplete="off" id="fgDatosEmpresa" [formGroup]="fgDatosEmpresa" (ngSubmit)="saveDatosEmpresa(fgDatosEmpresa)">
          <div class="row">
            <div class="col-lg-2">
                <div class="form-group">
                    <label>RUC</label>
                    <input type="text" minlength="11" maxlength="11" class="form-control" formControlName="ruc">
                </div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('ruc').hasError('required')">Obligatorio</div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('ruc').hasError('pattern')">Solo ingrese números</div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('ruc').hasError('maxLength')">RUC inválido</div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('ruc').hasError('minLength')">RUC inválido</div>
            </div>
            <div class="col-lg-5">
                <div class="form-group">
                    <label>Nombre Legal</label>
                    <input type="text" class="form-control" formControlName="nombreLegal">
                </div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('nombreLegal').hasError('required')">Obligatorio</div>
            </div>
            <div class="col-lg-5">
                <div class="form-group">
                    <label>Nombre Comercial</label>
                    <input type="text" class="form-control" formControlName="nombreComercial">
                </div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('nombreComercial').hasError('required')">Obligatorio</div>
            </div>
            <div class="col-lg-3">
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" class="form-control" formControlName="correoEmpresa">
                </div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('correoEmpresa').hasError('required')">Obligatorio</div>
                <div class="text-danger font-weight-bolder" *ngIf="fgDatosEmpresa.get('correoEmpresa').hasError('email')">Correo inválido</div>
            </div>
            <div class="col-lg-2">
                <div class="form-group">
                    <label>Celular</label>
                    <input type="text" class="form-control" formControlName="telefonos">
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" class="form-control" formControlName="direccion">
                </div>
            </div>
            <div class="col-lg-3">
                <div class="form-group">
                    <label>Página Web</label>
                    <input type="text" class="form-control" formControlName="pagina">
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form-group">
                    <label>Nombre de Banco</label>
                    <input type="text" class="form-control" formControlName="nombreBanco">
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form-group">
                    <label>Cuenta Bancaria</label>
                    <input type="text" class="form-control" formControlName="cuentasBancarias">
                </div>
            </div>
            <div class="col-lg-4">
                <div class="form-group">
                    <label>Código Interbancario</label>
                    <input type="text" class="form-control" formControlName="codigoInterbancario">
                </div>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-12">
              <div class="form-group">
                  <label class="font-weight-bold">Imágen:</label>
                  <div class="input-group">
                      <div class="col-lg-12 text-center p-2">
                          <img *ngIf="!imagenTemp" [src]="sinFoto" style="width: 10%;">
                          <img *ngIf="imagenTemp" [src]="imagenTemp" style="width: 10%;"><br><br>
                          <button (click)="eliminarImagen()" class="btn btn-danger btn-sm"><i class="fa fa-trash"></i> Eliminar Imágen</button>
                      </div>
                  </div>
                  <div class="input-group">
                      <div class="custom-file">
                          <input id="inputGroupFile01" (change)="seleccionImagen($event)" type="file" class="custom-file-input" accept="image/*">
                          <label class="custom-file-label" for="inputGroupFile01">{{textoImagen}}</label>
                      </div>
                  </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-6">
              <div class="form-group">
                <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
