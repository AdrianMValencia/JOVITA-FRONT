<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">{{ titulo }}</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
<span class="material-icons">close</span>
</button>
</div>

<!-- Body -->
<div class="modal-body">
  <div class="row">
      <form [formGroup]="formGroup" (ngSubmit)="crudPuntosVenta(formGroup)" class="col-lg-12">
          <div class="row">
              <div class="col-lg-6 form-group">
                <label>Nombre</label>
                <input type="text" formControlName="nombre" class="form-control">
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('nombre').invalid && (formGroup.get('nombre').dirty || formGroup.get('nombre').touched)">
                  Obligatorio.
                </div>
              </div>
              <div class="col-lg-6 form-group">
                <label>Dirección</label>
                <input type="text" class="form-control" formControlName="direccion">
              </div>
            <div class="col-lg-6 form-group">
              <label>Ubigeo</label>
              <div class="ng-autocomplete">
                <ng-autocomplete
                  style="margin-top: 0% !important;"
                  [data]="cboUbigeo"
                  [searchKeyword]="'ubigeo'"
                  placeholder=""
                  [itemTemplate]="itemTemplate"
                  [notFoundTemplate]="notFoundTemplate"
                  (selected)='selectEvent($event)'
                  formControlName="ubigeos">
                </ng-autocomplete>

                <ng-template #itemTemplate let-item>
                <a [innerHTML]="item.ubigeo"></a>
                </ng-template>

                <ng-template #notFoundTemplate let-notFound>
                <div [innerHTML]="notFound"></div>
                </ng-template>
              </div>
            </div>
              <div class="col-lg-3 form-group">
                <label>Teléfono</label>
                <input type="text" class="form-control" formControlName="telefono" maxlength="10">
              </div>
              <div class="col-lg-3 form-group">
                <label>Celular</label>
                <input type="text" class="form-control" formControlName="celular" maxlength="15" (input)="funcionesService.soloAceptarNumeros($event.target)">
              </div>
              <div class="col-lg-3 form-group">
                <label>Correo</label>
                <input type="text" class="form-control" formControlName="correo">
                <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('correo').hasError('email')">
                  Correo inválido.
                </div>
              </div>
              <div class="col-lg-9 form-group">
                <label>Observaciones</label>
                <input type="text" class="form-control" formControlName="observaciones">
            </div>
          </div>
          <div class="row">
              <div class="col-lg-6 form-group">
                  <mat-slide-toggle formControlName="status">Estado</mat-slide-toggle>
              </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-6 form-group">
                <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
                <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-save"></i> CERRAR</button>
            </div>
          </div>
      </form>
  </div>
</div>

<div class="modal-footer">
  <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
