<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Depositos</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
<span class="material-icons">close</span>
</button>
</div>

<!-- Body -->
<div class="modal-body">
<div class="row">
  <form autocomplete="off" novalidate [formGroup]="formGroup" (ngSubmit)="saveDepositos(formGroup)" class="col-lg-12">
      <div class="row">
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Punto de Venta</label>
            <input type="text" name="puntoventa" formControlName="puntoventa" class="form-control" readonly>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Fecha Deposito</label>
            <input type="date" name="fechaDeposito" formControlName="fechaDeposito" class="form-control">
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('fechaDeposito').invalid && (formGroup.get('fechaDeposito').dirty || formGroup.get('fechaDeposito').touched)">
              Obligatorio.
            </div>
          </div>
        </div>
        <div class="col-lg-12 form-group">
          <div class="form-group">
            <label>Bancos</label>
            <select name="idBanco" formControlName="idBanco" class="form-control form-select">
              <option value="0">[SELECCIONE]</option>
              <option *ngFor="let item of cboBancos" [value]="item.id">{{item.nombre}}</option>
            </select>
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('idBanco').invalid && (formGroup.get('idBanco').dirty || formGroup.get('idBanco').touched)">
              Obligatorio.
            </div>
          </div>
        </div>
          <div class="col-lg-12">
            <div class="form-group">
                <label class="font-weight-bold">Imágen:</label>
                <div class="input-group">
                    <div class="col-lg-12 text-center p-2">
                        <img *ngIf="!imagenTemp" [src]="sinFoto" style="width: 30%;">
                        <img *ngIf="imagenTemp" [src]="imagenTemp" style="width: 30%;"><br><br>
                        <button (click)="eliminarImagen()" class="btn btn-danger btn-sm"><i class="fa fa-trash"></i> Eliminar Imágen</button>
                    </div>
                </div>
                <div class="input-group">
                    <div class="custom-file">
                        <input id="inputGroupFile01" (change)="seleccionImagen($event)" type="file" class="custom-file-input" accept="image/*">
                        <label class="custom-file-label" for="inputGroupFile01">{{textoImagen}}</label>
                    </div>
                </div>
            </div>
          </div>
          <div class="col-lg-12">
            <div class="form-group">
              <label>Observaciones</label>
              <textarea class="form-control" formControlName="observaciones"></textarea>
            </div>
          </div>
      </div>
      <div class="row">
          <div class="col-lg-6">
              <mat-slide-toggle formControlName="status">Estado</mat-slide-toggle>
          </div>
      </div>
      <div class="row mt-3">
        <div class="col-lg-6 form-group">
            <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
            <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-save"></i> CERRAR</button>
        </div>
      </div>
  </form>
</div>
</div>

<div class="modal-footer">
  <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
