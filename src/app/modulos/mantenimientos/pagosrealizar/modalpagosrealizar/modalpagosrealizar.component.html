<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Pagos a Realizar</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
<span class="material-icons">close</span>
</button>
</div>

<!-- Body -->
<div class="modal-body">
<div class="row">
  <form autocomplete="off" novalidate [formGroup]="formGroup" (ngSubmit)="saveRegistro(formGroup)" class="col-lg-12">
      <div class="row">
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Punto de Venta</label>
            <input type="text" name="puntoventa" formControlName="puntoventa" class="form-control" readonly>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" formControlName="nombre" class="form-control">
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('nombre').invalid && (formGroup.get('nombre').dirty || formGroup.get('nombre').touched)">
              Obligatorio.
            </div>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Periodicidad</label>
            <select name="periodicidad" formControlName="periodicidad" class="form-control form-select">
              <option value="0">[SELECCIONE]</option>
              <option *ngFor="let item of cboPeriodicidad" [value]="item.codigo">{{item.titulo}}</option>
            </select>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Tipo</label>
            <select name="tipo" formControlName="tipo" class="form-control form-select">
              <option value="0">[SELECCIONE]</option>
              <option *ngFor="let item of cboTipo" [value]="item.codigo">{{item.titulo}}</option>
            </select>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Banco</label>
            <select name="idBanco" formControlName="idBanco" class="form-control form-select">
              <option value="0">[SELECCIONE]</option>
              <option *ngFor="let item of cboBancos" [value]="item.id">{{item.nombre}}</option>
            </select>
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('idBanco').invalid && (formGroup.get('idBanco').dirty || formGroup.get('idBanco').touched)">
              Obligatorio.
            </div>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Moneda</label>
            <select name="idMoneda" formControlName="idMoneda" class="form-control form-select">
              <option value="0">[SELECCIONE]</option>
              <option *ngFor="let item of cboMonedas" [value]="item.id">{{item.moneda}}</option>
            </select>
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('idMoneda').invalid && (formGroup.get('idMoneda').dirty || formGroup.get('idMoneda').touched)">
              Obligatorio.
            </div>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Cantidad</label>
            <input type="text" name="cantidad" formControlName="cantidad" class="form-control">
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('cantidad').invalid && (formGroup.get('cantidad').dirty || formGroup.get('cantidad').touched)">
              Obligatorio.
            </div>
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('cantidad').hasError('pattern')">
                Cantidad inválido
              </div>
          </div>
        </div>
        <div class="col-lg-6 form-group">
          <div class="form-group">
            <label>Monto</label>
            <input type="text" name="monto" formControlName="monto" class="form-control">
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('monto').invalid && (formGroup.get('monto').dirty || formGroup.get('monto').touched)">
              Obligatorio.
            </div>
            <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('monto').hasError('pattern')">
                Monto inválido
              </div>
          </div>
        </div>
        <div class="col-lg-12">
          <div class="form-group">
            <label>Observaciones</label>
            <textarea class="form-control" formControlName="observaciones"></textarea>
          </div>
        </div>
      </div>
      <div class="row">
          <div class="col-lg-6">
              <mat-slide-toggle formControlName="status">Estado</mat-slide-toggle>
          </div>
      </div>
      <div class="row mt-3">
        <div class="col-lg-6 form-group">
            <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
            <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-times"></i> CERRAR</button>
        </div>
      </div>
  </form>
</div>
</div>

<div class="modal-footer">
  <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
