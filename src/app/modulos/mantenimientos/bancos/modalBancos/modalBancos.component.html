<div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Bancos</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
  <span class="material-icons">close</span>
</button>
</div>

<!-- Body -->
<div class="modal-body">
  <div class="row">
    <form autocomplete="off" novalidate [formGroup]="formGroup" (ngSubmit)="saveBancos(formGroup)" class="col-lg-12">
          <div class="row">
            <div class="col-lg-6 form-group">
              <div class="form-group">
                <label>Punto de Venta</label>
                <input type="text" name="puntoventa" formControlName="puntoventa" class="form-control" readonly>
              </div>
            </div>
              <div class="col-lg-3">
                  <div class="form-group">
                      <label>RUC</label>
                      <input type="text" class="form-control" name="ruc" formControlName="ruc">
                      <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('ruc').hasError('required')">
                        Obligatorio.
                      </div>
                      <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('ruc').hasError('pattern')">
                        Solo números.
                      </div>
                      <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('ruc').hasError('maxLength')">
                        Formato de RUC inválido
                      </div>
                      <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('ruc').hasError('minLength')">
                        Formato de RUC inválido
                      </div>
                  </div>
              </div>
              <div class="col-lg-3 mt-3">
                <div class="form-group">
                  <button class="btn btn-primary dim" type="button" (click)="consultaSUNAT()">
                    <i class="fa fa-search"></i> Consulta RUC
                  </button>
                </div>
              </div>
              <div class="col-lg-6">
                  <div class="form-group">
                      <label>Nombre</label>
                      <input type="text" class="form-control" formControlName="nombre" readonly>
                      <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('nombre').invalid && (formGroup.get('nombre').dirty || formGroup.get('nombre').touched)">
                        Obligatorio.
                      </div>
                  </div>
              </div>
              <div class="col-lg-3">
                  <div class="form-group">
                      <label>Siglas</label>
                      <input type="text" class="form-control" formControlName="siglas">
                      <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('siglas').invalid && (formGroup.get('siglas').dirty || formGroup.get('siglas').touched)">
                        Obligatorio.
                      </div>
                  </div>
              </div>
              <div class="col-lg-3">
                  <div class="form-group">
                      <label>Funcionario</label>
                      <input type="text" class="form-control" formControlName="funcionario">
                  </div>
              </div>
              <div class="col-lg-4">
                  <div class="form-group">
                      <label>Telefono</label>
                      <input type="text" class="form-control" formControlName="telefono">
                  </div>
              </div>
              <div class="col-lg-4">
                  <div class="form-group">
                      <label>Celular</label>
                      <input type="text" class="form-control" formControlName="celular">
                  </div>
              </div>
              <div class="col-lg-4">
                <div class="form-group">
                    <label>Correo</label>
                    <input type="text" class="form-control" formControlName="correo">
                    <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('correo').invalid">
                      Correo inválido.
                    </div>
                </div>
            </div>
            <div class="col-lg-12">
              <div class="form-group">
                <label>Observaciones</label>
                <textarea class="form-control" formControlName="observaciones"></textarea>
              </div>
            </div>
          </div>
          <div class="row">
              <div class="col-lg-6">
                  <mat-slide-toggle formControlName="status">Estado</mat-slide-toggle>
              </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-6 form-group">
                <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
                <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-save"></i> CERRAR</button>
            </div>
          </div>
    </form>
  </div>
</div>

<div class="modal-footer">
    <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
