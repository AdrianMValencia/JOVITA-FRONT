<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-title">
        <h5 class="modal-title" id="modal-basic-title">FORMULARIO DE INGRESO DE DATOS</h5>
      </div>
      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-6">
            <div class="form-group">
              <label>Punto de Venta</label>
              <input type="text" name="puntoventa" [(ngModel)]="cierreCajas.puntoventa" class="form-control" readonly>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Usuario</label>
              <input type="text" name="usuario" [(ngModel)]="cierreCajas.usuario" class="form-control" readonly>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Fecha</label>
              <input type="datetime-local" name="fecha" [(ngModel)]="cierreCajas.fecha" class="form-control">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Proveedor</label>
              <select [(ngModel)]="cierreCajas.idProveedor" (change)="datosProveedor($event.target)" class="form-control form-select">
                <option value="0">[SELECCIONE]</option>
                <option *ngFor="let item of cboProveedores" [value]="item.id">{{item.razonsocial}}</option>
              </select>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>RUC</label>
              <input type="text" name="ruc" [(ngModel)]="cierreCajas.ruc" class="form-control" readonly>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Razón Social</label>
              <input type="text" name="razonSocial" [(ngModel)]="cierreCajas.razonSocial" class="form-control" readonly>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Comprobante a Pagar</label>
              <select [(ngModel)]="cierreCajas.idCompras" (change)="cargarOtros($event.target)" class="form-control form-select">
                <option value="0">[SELECCIONE]</option>
                <option value="999">INGRESAR MANUALMENTE</option>
                <option *ngFor="let item of cboCompras" [value]="item.id">{{item.nombreTipoDocumento}}-{{ item.numeroTipoDocumento }}</option>
              </select>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Medio de Pago</label>
              <select [(ngModel)]="cierreCajas.idMedioPago" class="form-control form-select">
                <option value="0">[SELECCIONE]</option>
                <option *ngFor="let item of cboMedioPago" [value]="item.id">{{item.nombre}}</option>
              </select>
            </div>
          </div>
          <div class="col-lg-12" *ngIf="cierreCajas.idCompras === 999 || cierreCajas.idCompras === '999'">
            <div class="form-group">
              <label>Ingrese el Comprobante de Pago</label>
              <input type="text" name="otros" [(ngModel)]="cierreCajas.otros" class="form-control" id="otros">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Monto</label>
              <input type="text" name="pagoProveedores" [(ngModel)]="cierreCajas.pagoProveedores" class="form-control" (keyup)="calcularPagoProveedores($event.target)"  (input)="funcionesService.soloAceptarNumerosPuntoDecimal($event.target)">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Total</label>
              <input type="text" name="salidasTotal" [(ngModel)]="cierreCajas.salidasTotal" class="form-control" readonly>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12"><button class="btn btn-outline btn-primary dim" (click)="GUARDARSALIDAPROVEEDORES('S')"><i class="fa fa-save"></i> GRABAR</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
