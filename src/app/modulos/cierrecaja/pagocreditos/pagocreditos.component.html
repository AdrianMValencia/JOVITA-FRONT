<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-title">
        <h5 class="modal-title" id="modal-basic-title">FORMULARIO DE INGRESO DE DATOS</h5>
      </div>
      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-6">
            <div class="form-group">
              <label>Punto de Venta</label>
              <input type="text" name="puntoventa" [(ngModel)]="cierreCajas.puntoventa" class="form-control" readonly>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label>Usuario</label>
              <input type="text" name="usuario" [(ngModel)]="cierreCajas.usuario" class="form-control" readonly>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="form-group">
              <label>Fecha</label>
              <input type="datetime-local" name="fecha" [(ngModel)]="cierreCajas.fecha" class="form-control">
            </div>
          </div>
          <div class="col-lg-4">
            <div class="form-group">
              <label>Número de Ticket</label>
              <select name="numeroTicket" [(ngModel)]="cierreCajas.numeroTicket" class="form-control form-select">
                <option value="0">[SELECCIONE]</option>
                <option *ngFor="let item of cboRecibos" [value]="item.id">{{ item.series }}-{{ item.numeracion }}</option>
              </select>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="form-group">
              <label>Monto</label>
              <input type="text" name="pagoCreaditos" [(ngModel)]="cierreCajas.pagoCreaditos" class="form-control" (input)="funcionesService.soloAceptarNumerosPuntoDecimal($event.target)">
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12"><button class="btn btn-outline btn-primary dim" (click)="GUARDARPAGOSCREDITOS('C')"><i class="fa fa-save"></i> GRABAR</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
