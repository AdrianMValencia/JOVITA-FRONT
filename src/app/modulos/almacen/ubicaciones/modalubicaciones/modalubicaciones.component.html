<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Ubicaciones</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span class="material-icons">close</span>
  </button>
</div>

<!-- Body -->
<div class="modal-body">
  <div class="row">
    <form autocomplete="off" novalidate [formGroup]="formGroup" (ngSubmit)="saveRegistro(formGroup)" class="col-lg-12">
          <div class="row">
            <div class="col-lg-6">
              <div class="form-group">
                <label>Punto de Venta</label>
                <input type="text" name="puntoventa" formControlName="puntoventa" class="form-control" readonly>
              </div>
            </div>
            <div class="col-lg-6 form-group">
              <label>Productos</label>
              <div class="ng-autocomplete">
                <ng-autocomplete
                  [data]="cboProducto"
                  [searchKeyword]="'nombre'"
                  placeholder=""
                  [itemTemplate]="itemTemplate"
                  [notFoundTemplate]="notFoundTemplate"
                  (selected)='selectEvent($event)'
                  formControlName="productos">
                </ng-autocomplete>

                <ng-template #itemTemplate let-item>
                <a [innerHTML]="item.nombre"></a>
                </ng-template>

                <ng-template #notFoundTemplate let-notFound>
                <div [innerHTML]="notFound"></div>
                </ng-template>
              </div>
              <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('productos').hasError('required')">
                Obligatorio.
              </div>
            </div>
            <div class="col-lg-6 form-group">
              <label>Almacenes</label>
              <div class="ng-autocomplete">
                <ng-autocomplete
                  [data]="cboAlmacenes"
                  [searchKeyword]="'nombre'"
                  placeholder=""
                  [itemTemplate]="itemTemplate"
                  [notFoundTemplate]="notFoundTemplate"
                  (selected)='selectEventAlmacen($event)'
                  formControlName="almacenes">
                </ng-autocomplete>

                <ng-template #itemTemplate let-item>
                <a [innerHTML]="item.nombre"></a>
                </ng-template>

                <ng-template #notFoundTemplate let-notFound>
                <div [innerHTML]="notFound"></div>
                </ng-template>
              </div>
              <div class="text-danger font-weight-bolder" *ngIf="formGroup.get('almacenes').hasError('required')">
                Obligatorio.
              </div>
            </div>
            <div class="col-lg-3">
                <div class="form-group">
                    <label>Ubicación 1</label>
                    <input type="text" class="form-control" formControlName="ubicacion1" required>
                </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                  <label>Anaquel 1</label>
                  <input type="text" class="form-control" formControlName="anaquel1" required>
              </div>
          </div>
          <div class="col-lg-3">
                <div class="form-group">
                    <label>Gaveta 1</label>
                    <input type="text" class="form-control" formControlName="gaveta1" required>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="form-group">
                    <label>Número de Gaveta 1</label>
                    <input type="text" class="form-control" formControlName="numeroGaveta1" required>
                </div>
            </div>
            <div class="col-lg-3">
              <div class="form-group">
                  <label>Ubicación 2</label>
                  <input type="text" class="form-control" formControlName="ubicacion2" required>
              </div>
          </div>
          <div class="col-lg-3">
            <div class="form-group">
                <label>Anaquel 2</label>
                <input type="text" class="form-control" formControlName="anaquel2" required>
            </div>
        </div>
        <div class="col-lg-3">
              <div class="form-group">
                  <label>Gaveta 2</label>
                  <input type="text" class="form-control" formControlName="gaveta2" required>
              </div>
          </div>
          <div class="col-lg-3">
              <div class="form-group">
                  <label>Número de Gaveta 2</label>
                  <input type="text" class="form-control" formControlName="numeroGaveta2" required>
              </div>
          </div>
            <div class="col-lg-12">
                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea class="form-control" formControlName="observaciones"></textarea>
                </div>
            </div>
          </div>
          <div class="row">
              <div class="col-lg-6">
                  <mat-slide-toggle formControlName="status">Estado</mat-slide-toggle>
              </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-6 form-group">
                <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
                <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-save"></i> CERRAR</button>
            </div>
          </div>
        </form>
  </div>
</div>

<div class="modal-footer">
    <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
