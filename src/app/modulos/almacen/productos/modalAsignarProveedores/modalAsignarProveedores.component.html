<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">Asignar Proveedores</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span class="material-icons">close</span>
  </button>
</div>

<div class="modal-body">
  <div class="row">
    <div class="col-lg-12">
      <div class="ibox ">
        <div class="ibox-content">
          <form autocomplete="off" id="formGroup" [formGroup]="formGroup">
            <div class="row">
              <div class="col-lg-6">
                <div class="form-group">
                  <label>Punto de Venta</label>
                  <input type="text" name="puntoventa" formControlName="puntoVenta" class="form-control" readonly>
                </div>
              </div>
               <div class="col-lg-6">
                <div class="form-group">
                  <label>Producto</label>
                  <input type="text" name="nombre" formControlName="nombre" class="form-control" readonly>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="form-group">
                  <label class="font-weight-bolder">Proveedor:</label>
                  <div class="ng-autocomplete">
                    <ng-autocomplete [data]="cboProveedores" [searchKeyword]="'razonsocial'" placeholder=""
                      [itemTemplate]="itemTemplate" [notFoundTemplate]="notFoundTemplate"
                      (selected)='selectEvent($event)' formControlName="proveedores">
                    </ng-autocomplete>

                    <ng-template #itemTemplate let-item>
                      <a [innerHTML]="item.razonsocial"></a>
                    </ng-template>

                    <ng-template #notFoundTemplate let-notFound>
                      <div [innerHTML]="notFound"></div>
                    </ng-template>
                  </div>
                </div>
              </div>
              <div class="col-lg-12" style="text-align: right;">
                <button (click)="crudRegistros()" type="button" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> Asignar Proveedor</button>
              </div>
            </div>
          </form>
        </div>
        <div class="ibox-content">
          <div class="row">
            <div class="col-lg-12">
              <div id="dTableMain" class="melevation table-responsive">
                <table mat-table [dataSource]="MainDS" class="example-full-width table table-bordered table-borderless table-hover table-striped" multiTemplateDataRows>

                  <ng-container matColumnDef="index">
                    <th mat-header-cell *matHeaderCellDef> # </th>
                    <td mat-cell *matCellDef="let element; let i = dataIndex;" class='m-card-title' data-label='# :'>
                      {{i + 1}}
                  </ng-container>
                  <ng-container matColumnDef="proveedor">
                    <th mat-header-cell *matHeaderCellDef> Proveedores </th>
                    <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Proveedores :'>
                      {{element.razonsocial}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="fecha">
                    <th mat-header-cell *matHeaderCellDef> Fecha Registro </th>
                    <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Fecha Registro :'>
                      {{element.created_at | date:'dd/MM/yyyy'}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="acciones">
                    <th mat-header-cell *matHeaderCellDef> Acciones </th>
                    <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Acciones :'>
                      <button class="btn btn-danger btn-rounded dim mt-2" (click)="eliminarRegistro(element)"><i
                          class="fa fa-trash"></i></button>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="noData">
                    <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                      No se encuentran registros.
                    </mat-footer-cell>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                  <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                  <mat-footer-row *matFooterRowDef="['noData']"
                    [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                  </mat-footer-row>
                </table>

              </div>
              <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="10"
                showFirstLastButtons>
              </mat-paginator>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-default dim" (click)="cerrarModal()"><i class="fa fa-times"></i> CERRAR</button>
</div>
