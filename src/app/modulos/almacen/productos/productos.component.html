<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-title">
        <h5>Aplicar filtro por :</h5>
      </div>

      <div class="ibox-content">
        <form autocomplete="off" id="fgMain" [formGroup]="fgMain">
          <div class="row">
            <div class="col-lg-12">
              <div class="form-group">
                <label class="font-weight-bolder">Codigo de Barras:</label>
                <input type="text" id="codigoBarra" name="codigoBarra" formControlName="codigoBarra"
                  class="form-control">
              </div>
            </div>
            <div class="col-lg-6">
              <label class="font-weight-bolder">Punto de Venta:</label>
              <input type="text" name="puntoVenta" formControlName="puntoventa" class="form-control" readonly>
            </div>
            <div class="col-lg-6">
              <label class="font-weight-bolder">Productos:</label>
              <input type="text" name="nombre" formControlName="nombre" class="form-control">
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-5">
              <label class="font-weight-bolder">Fecha de Inicio:</label>
              <input type="date" name="fechaIni" formControlName="fechaIni" class="form-control">
            </div>
            <div class="col-lg-5">
              <label class="font-weight-bolder">Fecha Fin:</label>
              <input type="date" name="fechaFin" formControlName="fechaFin" class="form-control">
            </div>
            <div class="col-lg-2">
              <button type="button" (click)="limpiar()" class="btn btn-success dim mt-3"><i
                  class="fa fa-eraser"></i></button>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-6 d-flex justify-content-start">
              <button (click)="crudRegistros()" type="button" class="btn btn-info dim mr-2"><i class="fa fa-save"></i>
                Agregar Producto</button>
            </div>
            <div class="col-lg-6 d-flex justify-content-end">
              <button type="button" (click)="downloadPDF()" class="btn btn-danger dim mr-2"><i
                  class="fa fa-file-pdf-o"></i> Descargar PDF</button>
              <button type="button" (click)="downloadExcel()" class="btn btn-primary dim"><i
                  class="fa fa-file-excel-o"></i> Descargar Excel</button>
            </div>
          </div>
        </form>
      </div>
      <hr>
      <!-- Body -->
      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-12">
            <div class="table-responsive">
              <div id="dTableMain" class="melevation table-responsive">
                <table mat-table [dataSource]="MainDS" class="example-full-width" multiTemplateDataRows>
                  <ng-container matColumnDef="categoria">
                    <th mat-header-cell *matHeaderCellDef> Categoria </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Categoria :'>
                      {{element.categorias.nombre}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="unidadMedidas">
                    <th mat-header-cell *matHeaderCellDef> Unidad de Medida </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Unidad de Medida :'>
                      {{element.um.nombre}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="nombre">
                    <th mat-header-cell *matHeaderCellDef> Producto </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Producto :'>
                      {{element.nombre}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="stockActual">
                    <th mat-header-cell *matHeaderCellDef> Stock Actual </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Stock Actual :'>
                      {{element.stockActual}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="precio">
                    <th mat-header-cell *matHeaderCellDef> Precio </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Precio :'>
                      {{element.precio}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="barcode">
                    <th mat-header-cell *matHeaderCellDef class="text-center"> Codigo de Barras </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title text-center'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Codigo de Barras :'>
                      <button (click)="barCode(element)" class="btn btn-info dim"><i class="fa fa-barcode"></i></button>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="proveedor">
                    <th mat-header-cell *matHeaderCellDef class="text-center"> Asignar Proveedor </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title text-center'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Asignar Proveedor :'>
                      <button (click)="asignarProveedor(element)" class="btn btn-warning dim"><i class="fa fa-user-circle"></i> ({{ element.proveedores.length }})</button>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="imagen">
                    <th mat-header-cell *matHeaderCellDef class="text-center"> Imagen </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title text-center'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Imagen :'>
                      <button class="btn btn-primary dim" (click)="openImagenModal(element)"><i class="fa fa-image"></i></button>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef class="text-center"> Estado </th>
                    <td mat-cell *matCellDef="let element" class='m-card-title text-center'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Estado :'>
                      <button class="btn btn-success btn-rounded dim mt-2"
                        *ngIf="element.status === 1 || element.status === '1'">ACTIVO</button>
                      <button class="btn btn-danger btn-rounded dim mt-2"
                        *ngIf="element.status === 0 || element.status === '0'">INACTIVO</button>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="acciones">
                    <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
                    <td mat-cell *matCellDef="let element" class='has_label_on_mobile text-center'
                      [ngClass]="{'productoStock': configurarProducto(element) , 'productoSinStock' : configurarProductoVacio(element) }"
                      data-label='Acciones :'>
                      <button class="btn btn-info btn-rounded dim mt-2" (click)="viewDetail(element)"><i
                          class="fa fa-edit"></i></button>
                      <button class="btn btn-danger btn-rounded dim mt-2" (click)="eliminarRegistro(element)"><i
                          class="fa fa-trash"></i></button>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="noData">
                    <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                      No se encuentran registros.
                    </mat-footer-cell>
                  </ng-container>
                  <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                  <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                  <mat-footer-row *matFooterRowDef="['noData']"
                    [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                  </mat-footer-row>
                </table>
              </div>
              <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="registrosPorPagina"
                [length]="totalRegistros" [pageIndex]="paginaActual - 1" [pageSizeOptions]="[10, 25, 50, 100]"
                (page)="onPageChange($event)" showFirstLastButtons>
              </mat-paginator>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
