<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">{{ titulo }}</h4>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span class="material-icons">close</span>
  </button>
</div>

<!-- Body -->
<div class="modal-body">
  <div class="row">
    <form autocomplete="off" novalidate [formGroup]="formGroup" (ngSubmit)="saveRegistro(formGroup)" class="col-lg-12">
      <div class="row">
        <div class="col-lg-6">
          <div class="form-group">
            <label class="font-weight-bolder">Código de Barras:</label>
            <input class="form-control form-control-sm" formControlName="codigo_barras" (keyup)="onEnter($event.target)">
          </div>
        </div>
        <div class="col-lg-6">
          <div class="form-group">
            <label class="font-weight-bolder">Productos:</label>
            <div class="ng-autocomplete">
              <ng-autocomplete [data]="cboProductos" [searchKeyword]="'nombre'" placeholder=""
                [itemTemplate]="itemTemplateProductos" [notFoundTemplate]="notFoundTemplateProductos"
                (selected)='selectEventProductos($event)' formControlName="productos">
              </ng-autocomplete>

              <ng-template #itemTemplateProductos let-item>
                <a [innerHTML]="item.nombre"></a>
              </ng-template>

              <ng-template #notFoundTemplateProductos let-notFound>
                <div [innerHTML]="notFound"></div>
              </ng-template>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="form-group">
            <label>Motivo</label>
            <select class="form-control" formControlName="motivo">
              <option value="">-- Seleccione --</option>
              <option value="Sobrante">Sobrante</option>
              <option value="Faltante">Faltante</option>
            </select>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" name="cantidad" formControlName="cantidad" class="form-control">
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-lg-6 form-group">
          <button type="submit" class="btn btn-primary dim mr-2"><i class="fa fa-save"></i> GUARDAR</button>
          <button type="button" class="btn btn-default dim" (click)="activeModal.dismiss()"><i class="fa fa-times"></i>
            CERRAR</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="modal-footer">
  <mat-progress-bar *ngIf="progressBar" color="accent" mode="indeterminate"></mat-progress-bar>
</div>
