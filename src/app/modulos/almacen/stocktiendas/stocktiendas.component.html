<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-12">
            <div class="form-group">
              <label class="font-weight-bolder">Punto de Venta:</label>
                <div class="ng-autocomplete">
                  <ng-autocomplete
                    [data]="cboPuntoVenta"
                    [searchKeyword]="'nombre'"
                    placeholder=""
                    [itemTemplate]="itemTemplate"
                    (selected)="eventSeleccion($event)"
                    [notFoundTemplate]="notFoundTemplate">
                  </ng-autocomplete>

                  <ng-template #itemTemplate let-item>
                  <a [innerHTML]="item.nombre"></a>
                  </ng-template>

                  <ng-template #notFoundTemplate let-notFound>
                  <div [innerHTML]="notFound"></div>
                  </ng-template>
                </div>
            </div>
          </div>
        </div>
        <div class="row" [formGroup]="fgMain">
          <div class="col-lg-6">
            <div class="form-group">
              <label class="font-weight-bolder">Codigo de Barras:</label>
              <input type="text" id="codigoBarra" name="codigoBarra" formControlName="codigoBarra" class="form-control">
            </div>
          </div>
          <div class="col-lg-6">
            <div class="form-group">
              <label class="font-weight-bolder">Productos:</label>
              <input type="text" name="nombre" formControlName="nombre" class="form-control">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12 d-flex justify-content-end">
              <button type="button" (click)="downloadExcel()" class="btn btn-primary dim"><i class="fa fa-file-excel-o"></i> Descargar Excel</button>
          </div>
        </div>
      </div>
      <hr>
      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-12">
            <div class="table-responsive">
              <div id="dTableMain" class="melevation">
                  <table mat-table [dataSource]="MainDS" class="example-full-width" multiTemplateDataRows>
                    <ng-container matColumnDef="categoria">
                      <th mat-header-cell *matHeaderCellDef> Categoria </th>
                      <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Categoria :'>
                          {{element.categorias.nombre}}
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="unidadMedidas">
                      <th mat-header-cell *matHeaderCellDef> Unidad de Medida </th>
                      <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Unidad de Medida :'>
                          {{element.um.nombre}}
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef> Producto </th>
                        <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Producto :'>
                            {{element.nombre}}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="stockActual">
                      <th mat-header-cell *matHeaderCellDef> Stock Actual </th>
                      <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Stock Actual :'>
                          {{element.stockActual}}
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="precio">
                        <th mat-header-cell *matHeaderCellDef> Precio </th>
                        <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Precio :'>
                            {{element.precio}}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef class="text-center"> Estado </th>
                        <td mat-cell *matCellDef="let element" class='m-card-title text-center' data-label='Estado :'>
                          <button class="btn btn-success btn-rounded dim mt-2" *ngIf="element.status === 1 || element.status === '1'">ACTIVO</button>
                          <button class="btn btn-danger btn-rounded dim mt-2" *ngIf="element.status === 0 || element.status === '0'">INACTIVO</button>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="acciones">
                      <th mat-header-cell *matHeaderCellDef> Acciones </th>
                      <td mat-cell *matCellDef="let element" class='has_label_on_mobile' data-label='Acciones :'>
                        <button class="btn btn-info btn-rounded dim mt-2" (click)="viewDetail(element)"><i class="fa fa-edit"></i></button>
                        <button class="btn btn-danger btn-rounded dim mt-2" (click)="eliminarRegistro(element)"><i class="fa fa-trash"></i></button>
                      </td>
                    </ng-container>
                    <ng-container matColumnDef="noData">
                        <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                            No se encuentran registros.
                        </mat-footer-cell>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                    <mat-footer-row *matFooterRowDef="['noData']" [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                    </mat-footer-row>
                  </table>
              </div>
              <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="10" showFirstLastButtons>
              </mat-paginator>
            </div>
          </div>
      </div>
      </div>
    </div>
  </div>
</div>
