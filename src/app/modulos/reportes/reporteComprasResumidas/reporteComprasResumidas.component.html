<div class="row">
  <div class="col-lg-12">
    <!-- Filtro -->
    <div class="ibox ">
      <div div class="ibox-title">
          <h5>Aplicar filtro por :</h5>
      </div>

      <div class="ibox-content">
        <form autocomplete="off" id="fgMain" [formGroup]="fgMain">
            <div class="row">
              <div class="col-lg-4">
                <div class="form-group">
                  <label class="font-weight-bolder">Punto de Venta:</label>
                  <input type="text" name="puntoVenta" formControlName="puntoventa" class="form-control" readonly>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="form-group">
                  <label class="font-weight-bolder">Proveedor:</label>
                  <div class="ng-autocomplete">
                    <ng-autocomplete
                      [data]="cboProveedores"
                      [searchKeyword]="'razonsocial'"
                      placeholder=""
                      [itemTemplate]="itemTemplate"
                      [notFoundTemplate]="notFoundTemplate"
                      (selected)='selectEvent($event)'
                      formControlName="proveedores">
                    </ng-autocomplete>

                    <ng-template #itemTemplate let-item>
                    <a [innerHTML]="item.razonsocial"></a>
                    </ng-template>

                    <ng-template #notFoundTemplate let-notFound>
                    <div [innerHTML]="notFound"></div>
                    </ng-template>
                  </div>
                </div>
              </div>
              <div class="col-lg-2">
                <div class="form-group">
                  <button type="button" (click)="buscar()" class="btn btn-success dim mt-3 mr-2"><i class="fa fa-search"></i></button>
                  <button type="button" (click)="limpiar()" class="btn btn-default dim mt-3"><i class="fa fa-eraser"></i></button>
                </div>
              </div>
            </div>
            <!-- <div class="row mt-3">
              <div class="col-lg-5">
                <div class="form-group">
                  <label class="font-weight-bolder">Fecha de Inicio:</label>
                  <input type="date" name="fechaIni" formControlName="fechaIni" class="form-control">
                </div>
              </div>
              <div class="col-lg-5">
                <div class="form-group">
                  <label class="font-weight-bolder">Fecha Fin:</label>
                  <input type="date" name="fechaFin" formControlName="fechaFin" class="form-control">
                </div>
              </div>
              <div class="col-lg-2">
                <div class="form-group">
                  <button type="button" (click)="buscar()" class="btn btn-success dim mt-3 mr-2"><i class="fa fa-search"></i></button>
                  <button type="button" (click)="limpiar()" class="btn btn-default dim mt-3"><i class="fa fa-eraser"></i></button>
                </div>
              </div>
            </div> -->
            <div class="row">
              <div class="col-lg-12 d-flex justify-content-end">
                <div class="form-group">
                  <button type="button" (click)="downloadPDF()" class="btn btn-danger dim mr-2"><i class="fa fa-file-pdf-o"></i> Descargar PDF</button>
                  <button type="button" (click)="downloadExcel()" class="btn btn-primary dim"><i class="fa fa-file-excel-o"></i> Descargar Excel</button>
                </div>
              </div>
            </div>
        </form>
      </div>

      <hr>

      <div class="ibox-content">
        <div class="row">
            <div class="col-lg-12">
                <div id="dTableMain" class="melevation">
                    <table mat-table [dataSource]="MainDS" matSort style="width: 100%;">
                        <ng-container matColumnDef="puntoventa">
                            <th mat-header-cell *matHeaderCellDef> Punto de Venta </th>
                            <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Punto de Venta :'>
                                {{element.puntoVenta}}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="mes">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Mes </th>
                            <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Mes :'>
                                {{funcionesService.meses(element.mes)}}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="ano">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header> Año </th>
                          <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Año :'>
                              {{element.ano}}
                          </td>
                      </ng-container>
                        <ng-container matColumnDef="rucProveedor">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> RUC Proveedor </th>
                            <td mat-cell *matCellDef="let element" class='m-card-title' data-label='RUC Proveedor :'>
                                {{element.rucProveedor}}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="nombreProveedor">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Razón Social </th>
                            <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Razón Social :'>
                                {{element.nombreProveedor}}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="totalCompras">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header> Monto de Compra </th>
                            <td mat-cell *matCellDef="let element" class='m-card-title' data-label='Monto de Compra :'>
                                S/{{element.totalCompras | number:'0.2-2'}}
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="noData">
                            <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                                No se encuentran registros.
                            </mat-footer-cell>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                        <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                        <mat-footer-row *matFooterRowDef="['noData']" [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                        </mat-footer-row>
                    </table>

                </div>
                <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="10" showFirstLastButtons></mat-paginator>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>
