<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-title">
        <h5>Aplicar filtro por :</h5>
      </div>

      <div class="ibox-content">
        <form autocomplete="off" id="formGroup" [formGroup]="formGroup">
          <div class="row">
            <div class="col-lg-6">
              <div class="form-group">
                <label class="font-weight-bolder">Productos:</label>
                <div class="ng-autocomplete">
                  <ng-autocomplete
                    [data]="cboProductos"
                    [searchKeyword]="'nombre'"
                    placeholder=""
                    [itemTemplate]="itemTemplateProductos"
                    [notFoundTemplate]="notFoundTemplateProductos"
                    (selected)='selectEventProductos($event)'
                    formControlName="productos">
                  </ng-autocomplete>

                  <ng-template #itemTemplateProductos let-item>
                  <a [innerHTML]="item.nombre"></a>
                  </ng-template>

                  <ng-template #notFoundTemplateProductos let-notFound>
                  <div [innerHTML]="notFound"></div>
                  </ng-template>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-12 d-flex justify-content-end">
                <button type="button" (click)="downloadPDF()" class="btn btn-danger dim mr-2"><i class="fa fa-file-pdf-o"></i> Descargar PDF</button>
                <button type="button" (click)="downloadExcel()" class="btn btn-primary dim"><i class="fa fa-file-excel-o"></i> Descargar Excel</button>
            </div>
          </div>
        </form>
      </div>
      <hr>
      <div class="ibox-content">
        <div class="row">
          <div class="col-lg-12">
            <div id="dTableMain" class="melevation">
              <table mat-table [dataSource]="MainDS" class="example-full-width" multiTemplateDataRows>
                  <ng-container matColumnDef="index">
                      <th mat-header-cell class="text-center" *matHeaderCellDef> # </th>
                      <td mat-cell *matCellDef="let element; let i = dataIndex;" style="text-align: center;" class='m-card-title' data-label='# :'>
                          {{i + 1}}
                      </td>
                  </ng-container>
                  <ng-container matColumnDef="producto">
                    <th mat-header-cell class="text-center" *matHeaderCellDef> Producto </th>
                    <td mat-cell *matCellDef="let element" style="text-align: center;" class='has_label_on_mobile' data-label='Producto :'>
                        {{element.nombre}}
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="proveedor">
                      <th mat-header-cell class="text-center" *matHeaderCellDef> Proveedor </th>
                      <td mat-cell *matCellDef="let element" style="text-align: center;" class='has_label_on_mobile' data-label='Proveedor :'>
                          {{element.razonsocial}}
                      </td>
                  </ng-container>
                  <ng-container matColumnDef="precio">
                      <th mat-header-cell class="text-center" *matHeaderCellDef> Precio Ultima Compra </th>
                      <td mat-cell *matCellDef="let element" style="text-align: center;" class='has_label_on_mobile' data-label='Precio Ultima Compra :'>
                          {{element.precioCompra}}
                      </td>
                  </ng-container>
                  <ng-container matColumnDef="noData">
                      <mat-footer-cell *matFooterCellDef [attr.colspan]="MainDC.length">
                          No se encuentran registros.
                      </mat-footer-cell>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="MainDC; sticky: true"></tr>
                  <tr mat-row *matRowDef="let row; columns: MainDC;"></tr>
                  <mat-footer-row *matFooterRowDef="['noData']" [hidden]="MainDS && this.MainDS.filteredData.length > 0">
                  </mat-footer-row>
              </table>
            </div>
            <mat-paginator #pagMain style="display: contents;" [hidePageSize]="false" [pageSize]="10" showFirstLastButtons></mat-paginator>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
